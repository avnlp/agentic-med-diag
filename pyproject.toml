[build-system]
requires = ["uv_build>=0.11.19, <=0.12.0"]
build-backend = "uv_build"

[project]
name = "am_diag"
version = "1.0.0"
description = "Agentic Graph-based Medical Diagnosis System"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = []
authors = [
  { name = "Ashwin Mathur", email = "" },
  { name = "Varun Mathur", email = "" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
]
dependencies = [
  "datasets>=3.0.0",
  "openai",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "tenacity>=8.0",
  "datasketch>=1.6.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.7.2",
  "scipy>=1.10.0",
  "neo4j>=5.27.0",
  "qdrant-client>=1.7.1",
  "weaviate-client>=4.0",
  "sentence-transformers>=5.5.1",
  "gliner>=0.2.0",
  "glirel>=0.1.0",
  "baml-py==0.222.0",
  "langgraph>=0.4.0",
  "deepeval>=3.2",
  "graspologic-native>=1.3",
  "langchain-text-splitters>=1.1.2",
  "markitdown>=0.1.6",
  "deepagents",
  "langchain-openai>=1.3.2",
  "semhash",
  "inflect>=7.5.0",
]

[project.scripts]
am-diag-ingest = "am_diag.pipelines.ingestion:main"
am-diag-qa = "am_diag.pipelines.qa:main"

[project.urls]
Documentation = "https://github.com/avnlp/agentic-med-diag#readme"
Issues = "https://github.com/avnlp/agentic-med-diag/issues"
Source = "https://github.com/avnlp/agentic-med-diag"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "coverage[toml]>=7.13.0",
  "ty>=0.0.32",
  "pip-audit>=2.10.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "pytest-socket>=0.7.0",
  "ruff>=0.15.20",
  "typos>=1.48.0",
]

[tool.uv.build-backend]
module-root = ""

[tool.uv]
default-groups = ["dev"]


[tool.ty.rules]
# `ty: ignore` comments target diagnostics that only some ty versions emit;
# don't fail the build on the versions that don't.
unused-ignore-comment = "ignore"

[tool.ty.environment]
# The project root (".") must come first so the real `am_diag` package resolves
# ahead of the `tests/am_diag/` test directory, which would otherwise shadow it
# and break resolution of `am_diag.*` submodules.
root = [".", "tests"]

[[tool.ty.overrides]]
include = ["_notes/**"]
[tool.ty.overrides.rules]
all = "ignore"

[[tool.ty.overrides]]
include = ["test_scripts/**"]
[tool.ty.overrides.rules]
all = "ignore"

[[tool.ty.overrides]]
include = ["am_diag/llm/baml_src/**", "am_diag/llm/baml_client/**"]
[tool.ty.overrides.rules]
all = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"
not-subscriptable = "ignore"
no-matching-overload = "ignore"

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "pyproject.toml", "*.ipynb"]
extend-exclude = [
  "_notes/",
  "test_scripts/",
  "am_diag/llm/baml_src/",
  "am_diag/llm/baml_client/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "COM", # flake8-commas
  "C4",  # flake8-comprehensions
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "ICN", # flake8-import-conventions
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle
  "N",   # pep8-naming
  "ERA", # eradicate
  "PL",  # pylint
]
ignore = [
  "PLR2004", # Replace magic number with named constant
  "COM812",  # Trailing comma missing
  "PLR0913", # Too many arguments — template-method ABCs require matching signatures
  "PLR0917", # Too many positional arguments — same signatures as PLR0913
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"tests/**/*.py" = ["D", "N802", "N999"]

"tests/am_diag/graph_construction/conftest.py" = ["E501"]
"tests/am_diag/graph_construction/test_aggregation.py" = ["PLR0913"]
"tests/am_diag/graph_construction/test_normalization.py" = ["PLR0913"]
"tests/am_diag/ingestion/conftest.py" = ["E501"]
"tests/am_diag/loaders/dataset/test_careqa_reasoning_integration.py" = ["E501"]
"tests/am_diag/loaders/dataset/test_medqa_integration.py" = ["E501"]
"tests/am_diag/loaders/dataset/test_nejm_qa.py" = ["E501"]
"tests/am_diag/loaders/dataset/test_pubhealthbench_integration.py" = ["E501"]
"tests/am_diag/loaders/dataset/test_supergpqa_med_integration.py" = ["E501"]
"tests/am_diag/db/vector/test_qdrant.py" = ["PLC0415"]
"tests/am_diag/retrieval/test_hybrid_retriever.py" = ["PLC0415"]
"tests/am_diag/db/graph/test_entity_relation_queries.py" = ["PLC0415"]
"tests/am_diag/graph_construction/test_resolution.py" = ["PLC0415"]
"tests/am_diag/graph_construction/extraction/test_llm_entity_relation_extractor.py" = [
  "PLC0415",
]
"tests/am_diag/loaders/dataset/test_models.py" = ["PLC0415"]
"tests/am_diag/common/data_models/test_datapoint.py" = ["PLC0415"]
"tests/am_diag/vector/reranking/test_sentence_transformers.py" = ["PLC0415"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
known-first-party = ["am_diag"]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -q -ra -n auto --dist loadscope -m 'not integration'"
markers = [
  "integration: Integration test that requires external services (Databases, APIs)",
  "slow: Slow running tests",
  "enable_socket: Enable socket access for this test (integration tests only)",
]
log_cli = false
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["am_diag"]
omit = [
  "tests/*",
  "test_scripts/*",
  "*/__init__.py",
  "am_diag/llm/baml_src/*",
  "am_diag/llm/baml_client/*",
]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.typos.files]
extend-exclude = [
  "_notes/",
  "test_scripts/",
  "thoughts/",
  "am_diag/llm/baml_src/",
  "am_diag/llm/baml_client/",
]

[tool.typos.default.extend-identifiers]
# SQLAlchemy lazy loading strategy name (not a typo)
selectin = "selectin"
# Medical acronym: Electronic Health Record
EHR = "EHR"
# Medical exam acronym: National Eligibility cum Entrance Test
NEET = "NEET"

[tool.bandit]
exclude_dirs = [
  "/tests",
  "/test_scripts",
  "/.venv",
  "/build",
  "/dist",
  "am_diag/llm/baml_src",
  "am_diag/llm/baml_client",
]
skips = ["B101"]
